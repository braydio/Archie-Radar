services:
  api:
    build: ./backend
    environment:
      ARCHIE_DATABASE_URL: sqlite:////data/archie_radar.db
      ARCHIE_CORS_ORIGINS: ${ARCHIE_CORS_ORIGINS:-*}
      ARCHIE_MEDIA_DIR: /data/media
      ARCHIE_PAWBOOST_AREAS: ${ARCHIE_PAWBOOST_AREAS:-chapel-hill-nc-27516,durham-nc-27701,mebane-nc-27302,pittsboro-nc-27312,raleigh-nc-27601,sanford-nc-27330}
      ARCHIE_PAWBOOST_PAGES: ${ARCHIE_PAWBOOST_PAGES:-2}
      ARCHIE_SCAN_MINUTES: ${ARCHIE_SCAN_MINUTES:-30}
      ARCHIE_AUTO_SCAN: ${ARCHIE_AUTO_SCAN:-true}
      ARCHIE_ORANGE_COUNTY_ENABLED: ${ARCHIE_ORANGE_COUNTY_ENABLED:-true}
      ARCHIE_REGIONAL_24PETCONNECT_ENABLED: ${ARCHIE_REGIONAL_24PETCONNECT_ENABLED:-true}
      ARCHIE_REGIONAL_24PETCONNECT_URL: ${ARCHIE_REGIONAL_24PETCONNECT_URL:-https://24petconnect.com/ViewAnimals/2779667}
      ARCHIE_APS_DURHAM_ENABLED: ${ARCHIE_APS_DURHAM_ENABLED:-true}
      ARCHIE_WAKE_COUNTY_ENABLED: ${ARCHIE_WAKE_COUNTY_ENABLED:-true}
      ARCHIE_PET911_ENABLED: ${ARCHIE_PET911_ENABLED:-true}
      ARCHIE_PET911_PLACES: ${ARCHIE_PET911_PLACES:-chapel-hill,durham,raleigh}
      ARCHIE_PETKEY_ENABLED: ${ARCHIE_PETKEY_ENABLED:-true}
      ARCHIE_PETKEY_PLACES: ${ARCHIE_PETKEY_PLACES:-chapel-hill_nc,durham_nc,raleigh_nc}
      ARCHIE_ANALYZE_IMAGES: ${ARCHIE_ANALYZE_IMAGES:-true}
      ARCHIE_MAX_IMAGE_BYTES: ${ARCHIE_MAX_IMAGE_BYTES:-8000000}
      ARCHIE_HOME_ADDRESS: "${ARCHIE_HOME_ADDRESS:-30 Dollar Road #A, Chapel Hill, NC 27516}"
      ARCHIE_HOME_LATITUDE: ${ARCHIE_HOME_LATITUDE:-35.845701}
      ARCHIE_HOME_LONGITUDE: ${ARCHIE_HOME_LONGITUDE:--79.117282}
      ARCHIE_SEARCH_RADIUS_MILES: ${ARCHIE_SEARCH_RADIUS_MILES:-25}
      ARCHIE_GEOCODE_ENABLED: ${ARCHIE_GEOCODE_ENABLED:-true}
      ARCHIE_GEOCODE_USER_AGENT: ${ARCHIE_GEOCODE_USER_AGENT:-ArchieRadar/0.7 lost-pet-reunion-project}
      ARCHIE_GEOCODE_BASE_URL: ${ARCHIE_GEOCODE_BASE_URL:-https://nominatim.openstreetmap.org}
      ARCHIE_GEOCODE_MIN_DELAY_SECONDS: ${ARCHIE_GEOCODE_MIN_DELAY_SECONDS:-15.1}
      ARCHIE_GEOCODE_BACKFILL_LIMIT: ${ARCHIE_GEOCODE_BACKFILL_LIMIT:-150}
      ARCHIE_PETCO_API_KEY: ${ARCHIE_PETCO_API_KEY:-}
    volumes:
      - archie-data:/data
    ports:
      - "${ARCHIE_API_HOST_PORT:-8001}:8000"

  web:
    build: ./frontend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
      VITE_API_PORT: ${ARCHIE_API_HOST_PORT:-8001}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  archie-data:
